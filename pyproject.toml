[project]
name = "tgdl"
version = "1.3.2"
description = "Download photos and videos from Telegram channels you already joined."
requires-python = ">=3.10"
dependencies = [
  "telethon>=1.37.0",
  "python-dotenv>=1.0.1",
  "tqdm>=4.66.0",
  "aiohttp>=3.9.0",
]

[project.scripts]
tgdl = "tgdl.cli:main"

[project.gui-scripts]
tgdl-gui = "tgdl.gui:run_gui"
